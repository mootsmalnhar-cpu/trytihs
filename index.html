<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryThis</title>
    <style>
        :root[data-theme="dark"] { --bg: #121212; --card: #1e1e1e; --text: #fff; --accent: #4fa3d1; }
        :root[data-theme="light"] { --bg: #f5f5f5; --card: #fff; --text: #000; --accent: #007acc; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; transition: 0.3s; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        button { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .badge { background: #22c55e; color: black; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>TryThis</h2>
        <button onclick="toggleTheme()">☀️ / 🌙</button>
    </div>

    <div class="card">
        <div class="profile">
            <h3>المسؤول: shlal</h3>
            <span class="badge">Admin</span>
        </div>
        <p>مرحباً بك في المنصة الخاصة بك! الموقع قيد التشغيل الآن.</p>
    </div>

    <script>
        function toggleTheme() {
            let current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
